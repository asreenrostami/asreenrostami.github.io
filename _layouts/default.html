<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author }}">

  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>

  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Saira+Extra+Condensed:500,700" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Muli:400,400i,800,800i" rel="stylesheet">

  <!-- Icons / framework (vendored locally, no third-party CDN dependency) -->
  <link href="{{ '/assets/vendor/bootstrap/css/bootstrap.min.css' | relative_url }}" rel="stylesheet">
  <link href="{{ '/assets/vendor/fontawesome-free/css/all.min.css' | relative_url }}" rel="stylesheet">

  <!-- Site styles -->
  <link href="{{ '/assets/css/style.css' | relative_url }}" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>

      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mr-auto">
          {% for item in site.nav %}
          <li class="nav-item">
            <a class="nav-link{% if page.url == item.url %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
          </li>
          {% endfor %}
        </ul>

        <ul class="navbar-nav social-nav">
          <li class="nav-item">
            <a class="nav-link" href="{{ site.social.acm }}" target="_blank" rel="noopener" title="ACM Digital Library" aria-label="ACM Digital Library"><span class="icon-text">ACM</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ site.social.linkedin }}" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ site.social.orcid }}" target="_blank" rel="noopener" title="ORCID" aria-label="ORCID">{% include icon-orcid.html %}</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ site.social.scholar }}" target="_blank" rel="noopener" title="Google Scholar" aria-label="Google Scholar"><i class="fas fa-graduation-cap"></i></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container page-content">
    {% unless page.hide_title %}
    <h1 class="page-title">{{ page.title }}</h1>
    {% endunless %}
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</span>
      <ul class="social-nav footer-social">
        <li><a href="{{ site.social.acm }}" target="_blank" rel="noopener" aria-label="ACM Digital Library"><span class="icon-text">ACM</span></a></li>
        <li><a href="{{ site.social.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a></li>
        <li><a href="{{ site.social.orcid }}" target="_blank" rel="noopener" aria-label="ORCID">{% include icon-orcid.html %}</a></li>
        <li><a href="{{ site.social.scholar }}" target="_blank" rel="noopener" aria-label="Google Scholar"><i class="fas fa-graduation-cap"></i></a></li>
      </ul>
    </div>
  </footer>

  <script src="{{ '/assets/vendor/jquery/jquery.min.js' | relative_url }}"></script>
  <script src="{{ '/assets/vendor/bootstrap/js/bootstrap.bundle.min.js' | relative_url }}"></script>
</body>
</html>
